{id:6,topic:"Investigating Communication",type:"mcq",text:"Which research method involves direct watching of behavior?",options:["Survey","Observation","Interview","Questionnaire"],correctAnswer:"Observation",explanation:"Observation is a qualitative method where researchers directly watch and record subjects in their natural environment."},{id:7,topic:"Investigating Communication",type:"mcq",text:"A structured set of questions is called:",options:["Interview","Observation","Questionnaire","Experiment"],correctAnswer:"Questionnaire",explanation:"A questionnaire is a research instrument consisting of a structured series of questions for gathering data."},{id:8,topic:"Investigating Communication",type:"mcq",text:"Which skill helps correct communication problems?",options:["Ignoring others","Active listening","Speaking loudly","Interrupting"],correctAnswer:"Active listening",explanation:"Active listening involves fully concentrating, understanding, responding, and remembering, which resolves miscommunications."},{id:9,topic:"Investigating Communication",type:"mcq",text:"What is a communication channel?",options:["A person","A medium used to send messages","A barrier","A response"],correctAnswer:"A medium used to send messages",explanation:"A communication channel is the specific medium (e.g., spoken word, email, gesture) through which a message is transmitted."},{id:10,topic:"Investigating Communication",type:"mcq",text:"Which factor affects communication effectiveness?",options:["Weather only","Cultural differences","Food habits","Clothing"],correctAnswer:"Cultural differences",explanation:"Cultural differences shape language, norms, and nonverbal cues, heavily impacting how messages are interpreted."},{id:11,topic:"Investigating Communication",type:"mcq",text:"Non-verbal communication includes:",options:["Speaking","Writing","Body language","Reading"],correctAnswer:"Body language",explanation:"Non-verbal communication relies on physical cues like body language, facial expressions, and gestures instead of words."},{id:12,topic:"Investigating Communication",type:"mcq",text:"Which method collects in-depth information?",options:["Survey","Interview","Observation","Experiment"],correctAnswer:"Interview",explanation:"Interviews allow researchers to ask probing, open-ended questions to gather detailed, in-depth qualitative data."},{id:13,topic:"Investigating Communication",type:"mcq",text:"What is the first step in investigating communication problems?",options:["Ignoring the issue","Identifying the problem","Giving punishment","Changing people"],correctAnswer:"Identifying the problem",explanation:"The scientific or sociological method always begins with clearly identifying and defining the problem."},{id:14,topic:"Investigating Communication",type:"mcq",text:"Which of the following improves communication?",options:["Assumptions","Clarification","Silence always","Avoiding feedback"],correctAnswer:"Clarification",explanation:"Clarification helps ensure that the receiver accurately understands the sender's original message, removing ambiguity."},{id:15,topic:"Investigating Communication",type:"mcq",text:"What is a common barrier in communication?",options:["Trust","Language differences","Feedback","Understanding"],correctAnswer:"Language differences",explanation:"Language differences act as a significant barrier by preventing accurate encoding and decoding of messages."},{id:16,topic:"Investigating Communication",type:"mcq",text:"Which research tool uses face-to-face questioning?",options:["Questionnaire","Interview","Observation","Survey only"],correctAnswer:"Interview",explanation:"Interviews typically involve direct, face-to-face conversational questioning to gather data."},{id:17,topic:"Investigating Communication",type:"mcq",text:"What does “encoding” mean in communication?",options:["Receiving a message","Interpreting a message","Sending a message","Creating a message"],correctAnswer:"Creating a message",explanation:"Encoding is the process of turning thoughts into communication (creating the message)."},{id:18,topic:"Investigating Communication",type:"mcq",text:"“Decoding” refers to:",options:["Sending a message","Understanding a message","Ignoring a message","Blocking a message"],correctAnswer:"Understanding a message",explanation:"Decoding is the receiver's process of interpreting and understanding the encoded message."},{id:19,topic:"Investigating Communication",type:"mcq",text:"Which factor can distort a message?",options:["Clear speech","Noise","Feedback","Listening"],correctAnswer:"Noise",explanation:"Noise introduces interference—whether literal sounds or psychological distractions—that distorts messages."},{id:20,topic:"Investigating Communication",type:"mcq",text:"Which sociological method uses numerical data?",options:["Qualitative","Quantitative","Observation","Interview"],correctAnswer:"Quantitative",explanation:"Quantitative research focuses on numerical data and statistical analysis."},{id:21,topic:"Investigating Communication",type:"mcq",text:"What is the purpose of active listening?",options:["To interrupt","To understand clearly","To argue","To ignore"],correctAnswer:"To understand clearly",explanation:"Active listening aims for a comprehensive, clear understanding of the speaker's intent and emotion."},{id:22,topic:"Investigating Communication",type:"mcq",text:"Which is an example of verbal communication?",options:["Gestures","Facial expressions","Speaking","Posture"],correctAnswer:"Speaking",explanation:"Verbal communication involves the use of spoken words (or sometimes written words) to convey messages."},{id:23,topic:"Investigating Communication",type:"mcq",text:"Which is a step in correcting communication?",options:["Avoiding discussion","Giving clear feedback","Ignoring errors","Increasing noise"],correctAnswer:"Giving clear feedback",explanation:"Clear feedback lets the sender know if their message was accurately received, allowing corrections."},{id:24,topic:"Investigating Communication",type:"mcq",text:"What does “noise” refer to in communication?",options:["Music only","Any disturbance","Silence","Speaking loudly"],correctAnswer:"Any disturbance",explanation:"In communication theory, 'noise' broadly encompasses any disturbance or interference with the message."},{id:25,topic:"Investigating Communication",type:"mcq",text:"Which method is best for large groups?",options:["Interview","Observation","Questionnaire","Experiment"],correctAnswer:"Questionnaire",explanation:"Questionnaires can be distributed efficiently to large samples of people, making them ideal for broad sociological surveys."},{id:26,topic:"Investigating Communication",type:"mcq",text:"Cultural barriers affect communication by:",options:["Improving clarity","Creating misunderstandings","Reducing language use","Increasing noise only"],correctAnswer:"Creating misunderstandings",explanation:"Different cultural norms and contexts can cause the same message to be interpreted in completely different ways, causing misunderstandings."},{id:27,topic:"Investigating Communication",type:"mcq",text:"What is the role of a researcher in communication study?",options:["To ignore data","To collect and analyze data","To judge people","To punish participants"],correctAnswer:"To collect and analyze data",explanation:"A researcher's primary role is an objective collection, observation, and analysis of sociological data."},{id:28,topic:"Investigating Communication",type:"mcq",text:"Which technique helps avoid misunderstandings?",options:["Assumptions","Asking questions","Ignoring feedback","Interrupting"],correctAnswer:"Asking questions",explanation:"Asking questions clarifications intent and resolves ambiguities before they become major misunderstandings."},{id:29,topic:"Investigating Communication",type:"mcq",text:"What is a primary source of data?",options:["Book","Website","Direct information collected","Newspaper"],correctAnswer:"Direct information collected",explanation:"Primary data refers to original or direct information collected firsthand by the researcher."},{id:30,topic:"Investigating Communication",type:"mcq",text:"Effective communication requires:",options:["One-way speaking","Clear message and feedback","Silence only","No interaction"],correctAnswer:"Clear message and feedback",explanation:"Effectiveness depends on clarity from the sender and appropriate feedback from the receiver."},{id:31,topic:"Social Problems",type:"mcq",text:"What is a social problem?",options:["A personal issue only","A problem affecting society as a whole","A natural disaster","A business issue"],correctAnswer:"A problem affecting society as a whole",explanation:"A social problem is a public issue that negatively impacts a large number of people in a society."},{id:32,topic:"Social Problems",type:"mcq",text:"Which of the following is an example of a social problem?",options:["Hunger","Fashion trends","Personal hobbies","Weather changes"],correctAnswer:"Hunger",explanation:"Hunger is a systemic issue impacting many people, making it a recognized social problem."},{id:33,topic:"Social Problems",type:"mcq",text:"Poverty is considered a social problem because it:",options:["Affects only individuals","Has no impact on society","Affects a large number of people","Is temporary"],correctAnswer:"Affects a large number of people",explanation:"A problem becomes 'social' when it extends beyond isolated personal troubles and affects large portions of the population."},{id:34,topic:"Social Problems",type:"mcq",text:"Unemployment refers to:",options:["People working part-time","People without jobs but willing to work","People who are retired","Students studying"],correctAnswer:"People without jobs but willing to work",explanation:"Unemployment specifically measures those who are actively seeking work but unable to find it."},{id:35,topic:"Social Problems",type:"mcq",text:"Crime is a social problem because it:",options:["Improves society","Breaks social norms and laws","Is always accepted","Helps development"],correctAnswer:"Breaks social norms and laws",explanation:"Crime violates established social laws and negatively impacts the safety and cohesion of communities."},{id:36,topic:"Social Problems",type:"mcq",text:"Which factor contributes to social problems?",options:["Equality","Education","Inequality","Cooperation"],correctAnswer:"Inequality",explanation:"Inequalities in wealth, opportunity, and status are core drivers of many social problems."},{id:37,topic:"Social Problems",type:"mcq",text:"Illiteracy refers to:",options:["Ability to read and write","Lack of education","High income","Employment"],correctAnswer:"Lack of education",explanation:"Illiteracy fundamentally relates to a lacking educational foundation, specifically the inability to read and write."},{id:38,topic:"Social Problems",type:"mcq",text:"Overpopulation can lead to:",options:["More resources","Resource shortage","Less competition","More jobs"],correctAnswer:"Resource shortage",explanation:"Overpopulation strains infrastructure and depletes natural and societal resources."},{id:39,topic:"Social Problems",type:"mcq",text:"Which is a cause of poverty?",options:["High education","Lack of employment","Equal income","Strong economy"],correctAnswer:"Lack of employment",explanation:"Lack of employment cuts off income, which directly leads to poverty."},{id:40,topic:"Social Problems",type:"mcq",text:"Drug abuse is considered a social problem because it:",options:["Benefits health","Affects individuals and society negatively","Improves productivity","Is harmless"],correctAnswer:"Affects individuals and society negatively",explanation:"Substance abuse burdens healthcare, criminal justice systems, and familial structures—affecting society as a whole."},{id:41,topic:"Social Problems",type:"mcq",text:"Social inequality refers to:",options:["Equal distribution of resources","Unequal opportunities and resources","Fair treatment","Equal rights"],correctAnswer:"Unequal opportunities and resources",explanation:"Inequality is the uneven distribution of opportunities, wealth, and privileges within a group."},{id:42,topic:"Social Problems",type:"mcq",text:"Which of the following is NOT a social problem?",options:["Crime","Pollution","Education","Unemployment"],correctAnswer:"Education",explanation:"Education is a social institution and generally a solution, whereas crime, pollution, and unemployment are problems."},{id:43,topic:"Social Problems",type:"mcq",text:"Pollution affects society by:",options:["Improving health","Damaging the environment","Increasing resources","Reducing population only"],correctAnswer:"Damaging the environment",explanation:"Pollution degrades environmental health, ultimately affecting human health and sustainable living."},{id:44,topic:"Social Problems",type:"mcq",text:"Child labor is a social problem because it:",options:["Helps children grow","Exploits children","Improves education","Is always legal"],correctAnswer:"Exploits children",explanation:"Child labor is abusive and deprives children of their basic rights and education, hence exploiting them."},{id:45,topic:"Social Problems",type:"mcq",text:"What is a common effect of unemployment?",options:["Increased income","Social unrest","Better living standards","More savings"],correctAnswer:"Social unrest",explanation:"High rates of unemployment often lead to frustration, poverty, and consequently social unrest."},{id:46,topic:"Social Problems",type:"mcq",text:"Which organization often works to solve social problems?",options:["Schools only","Government","Individuals only","Shops"],correctAnswer:"Government",explanation:"Governments implement policies, laws, and welfare programs on a large scale to tackle social problems."},{id:47,topic:"Social Problems",type:"mcq",text:"Homelessness is a social problem because:",options:["It affects only housing","It affects living conditions and society","It improves economy","It is not serious"],correctAnswer:"It affects living conditions and society",explanation:"Homelessness is interlinked with poverty, mental health, and public resources, affecting society as a whole."},{id:48,topic:"Social Problems",type:"mcq",text:"Which is a solution to social problems?",options:["Ignoring them","Education and awareness","Increasing inequality","Reducing communication"],correctAnswer:"Education and awareness",explanation:"Spreading awareness and providing education empower societies to recognize and collectively solve problems."},{id:49,topic:"Social Problems",type:"mcq",text:"Gender inequality refers to:",options:["Equal rights","Fair opportunities","Unequal treatment based on gender","Equal pay"],correctAnswer:"Unequal treatment based on gender",explanation:"Gender inequality is the societal phenomenon where individuals are treated differently solely based on their gender."},{id:50,topic:"Social Problems",type:"mcq",text:"Social problems require:",options:["Individual effort only","Collective action","No action","Random solutions"],correctAnswer:"Collective action",explanation:"Because social problems affect groups broadly, they require organized, collective actions to properly address."},{id:51,topic:"Social Problems",type:"tf",text:"Social problems affect only individuals, not society.",options:["True","False"],correctAnswer:"False",explanation:"By definition, a social problem must affect society as a whole, not just an isolated individual."},{id:52,topic:"Social Problems",type:"tf",text:"Poverty is considered a major social problem.",options:["True","False"],correctAnswer:"True",explanation:"Poverty affects millions and drives other issues like crime and uneven health outcomes, making it a major social problem."},{id:53,topic:"Social Problems",type:"tf",text:"Unemployment has no effect on society.",options:["True","False"],correctAnswer:"False",explanation:"Unemployment severely impacts the economy, family stability, and social cohesion."},{id:54,topic:"Social Problems",type:"tf",text:"Crime is a violation of social rules and laws.",options:["True","False"],correctAnswer:"True",explanation:"Crime is explicitly defined as behavior that violates official laws and societal norms."},{id:55,topic:"Social Problems",type:"tf",text:"Social problems are always easy to solve.",options:["True","False"],correctAnswer:"False",explanation:"Social problems are usually deeply ingrained, multifaceted, and extremely complex to solve."},{id:56,topic:"Social Problems",type:"tf",text:"Illiteracy means the ability to read and write.",options:["True","False"],correctAnswer:"False",explanation:"Literacy is the ability to read and write; illiteracy is the inability or lack of it."},{id:57,topic:"Social Problems",type:"tf",text:"Overpopulation can lead to shortage of resources.",options:["True","False"],correctAnswer:"True",explanation:"An rapidly expanding population consumes water, food, and energy, leading to significant shortages."},{id:58,topic:"Social Problems",type:"tf",text:"Drug abuse affects only the individual, not society.",options:["True","False"],correctAnswer:"False",explanation:"Drug abuse strains healthcare, fuels crime, and breaks down communities, affecting all of society."},{id:59,topic:"Social Problems",type:"tf",text:"Social inequality refers to unequal distribution of resources and opportunities.",options:["True","False"],correctAnswer:"True",explanation:"This is the exact definition of social inequality: unevenness in wealth, jobs, and rights."},{id:60,topic:"Social Problems",type:"tf",text:"Pollution has no impact on human health.",options:["True","False"],correctAnswer:"False",explanation:"Pollution directly causes respiratory diseases, cancers, and widespread health crises."},{id:61,topic:"Social Problems",type:"tf",text:"Child labor is considered a social problem.",options:["True","False"],correctAnswer:"True",explanation:"It is an abusive practice that robs children of standard development and education, affecting future society."},{id:62,topic:"Social Problems",type:"tf",text:"Education can help reduce social problems.",options:["True","False"],correctAnswer:"True",explanation:"Education builds awareness and empowers individuals, acting as a primary tool to mitigate social failures."},{id:63,topic:"Social Problems",type:"tf",text:"Homelessness affects only housing conditions and nothing else.",options:["True","False"],correctAnswer:"False",explanation:"Homelessness affects extreme health outcomes, employment prospects, and family structures as well."},{id:64,topic:"Social Problems",type:"tf",text:"Gender inequality is a form of social problem.",options:["True","False"],correctAnswer:"True",explanation:"It structurally disadvantages roughly half the population, making it a pivotal social problem."},{id:65,topic:"Social Problems",type:"tf",text:"Social problems are caused only by natural factors.",options:["True","False"],correctAnswer:"False",explanation:"Most social problems are primarily caused by human systems, economics, policies, and behavior, not nature."},{id:66,topic:"Social Problems",type:"tf",text:"Government plays no role in solving social problems.",options:["True","False"],correctAnswer:"False",explanation:"Governments actively use policy and legislation (welfare, laws, taxation) to remedy social problems."},{id:67,topic:"Social Problems",type:"tf",text:"Crime can lead to social instability.",options:["True","False"],correctAnswer:"True",explanation:"High crime rates breed fear, disrupt local economies, and erode trust, driving instability."},{id:68,topic:"Social Problems",type:"tf",text:"Awareness and education can help reduce social problems.",options:["True","False"],correctAnswer:"True",explanation:"Informing the public is essential to catalyzing any meaningful, collective long-term change."},{id:69,topic:"Social Problems",type:"tf",text:"Social problems affect a large number of people in society.",options:["True","False"],correctAnswer:"True",explanation:"By its core definition, a sociological pr
